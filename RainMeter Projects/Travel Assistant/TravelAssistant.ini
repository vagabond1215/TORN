; Includes are parsed in-place by Rainmeter. Keep card meters after the full-panel
; background, then place info anchors last so their hover targets sit above cards.
@IncludeRows=#@#Includes\OpportunityRows.inc
@IncludeInfo=#@#Includes\OpportunityInfo.inc
