[MeasureUpdate]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\RunUpdate.ps1" -Action Update
State=Hide
Timeout=30000
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeter *][!Redraw]

[MeasureSettings]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\LaunchSettings.ps1"
State=Hide
Timeout=5000

[MeasureFilterPopup]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\LaunchFilterPopup.ps1" -Filter "#FilterRequest#"
State=Hide
Timeout=5000
DynamicVariables=1

[MeasurePreferenceAction]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\FilterPreferences.ps1" -Action "#PreferenceAction#" -Value "#PreferenceValue#"
State=Hide
Timeout=5000
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeter *][!Redraw]

[MeasureState]
Measure=Script
ScriptFile=#@#Scripts\StateReader.lua
StateFile=#@#Generated\state.kv
HeartbeatFile=#@#Generated\last-update.txt
PreferencesFile=#CURRENTPATH#data\runtime\preferences.json
PollInterval=60
FailureRetryInterval=15
MaxExpandedCards=#MaxExpandedCards#
UpdateDivider=1

