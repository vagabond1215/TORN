[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureUpdate "Run"]

[Metadata]
Name=Travel Assistant
Author=vagabond1215
Information=Torn foreign-market opportunity browser with transparent sorting, FlagKit destination flags, and local 8-hour graphs.
Version=0.6.0

[Variables]
PanelWidth=552
PanelHeight=160
Text=222,226,232,255
Muted=145,152,164,255
Panel=24,27,31,248
Card=31,35,40,248
Border=58,64,73,255
Accent=82,174,255,255
Good=86,190,116,255
Bad=224,90,90,255
UpdatedText=Waiting for first update...
ItemFilterText=All
CategoryFilterText=All
TripShortColor=82,174,255,255
TripMediumColor=82,174,255,255
TripLongColor=82,174,255,255
SortUpcomingColor=82,174,255,255
SortGrossColor=145,152,164,255
SortProfitHourColor=145,152,164,255
FilterRequest=Filters
PreferenceAction=None
PreferenceValue=
InlineGraphMarketKey=
OpportunityMessageText=Learning opportunities...

[MeasureUpdate]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\LaunchUpdate.ps1" -Action Update
State=Hide
; Rainmeter owns only the short launcher. LaunchUpdate detaches the real PS7 worker,
; so RunCommand cannot kill a healthy multi-minute projection at this timeout.
; RunUpdate's named mutex prevents overlapping workers from doing duplicate work.
Timeout=90000
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeasure MeasureHeaderLayout][!UpdateMeasure MeasureCardPresenter][!UpdateMeasure MeasureCardTweaks][!UpdateMeasure MeasureFreshnessGuard][!UpdateMeasure MeasureTravelStateWindowTweaks][!UpdateMeasure MeasureWindowTooltipTweaks][!UpdateMeasure MeasureFinalCardPolish][!UpdateMeter *][!Redraw]

[MeasureSettings]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\LaunchOptimizerSettings.ps1"
State=Hide
Timeout=5000

[MeasureFilterPopup]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\LaunchFilterPopup.ps1" -Filter "#FilterRequest#"
State=Hide
Timeout=5000
DynamicVariables=1

; Local-only in-card renderer. No popup host and no network request.
[MeasureInlineGraph]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\RenderInlineGraph.ps1" -MarketKey "#InlineGraphMarketKey#"
State=Hide
Timeout=10000
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeasure MeasureHeaderLayout][!UpdateMeasure MeasureCardPresenter][!UpdateMeasure MeasureCardTweaks][!UpdateMeasure MeasureFreshnessGuard][!UpdateMeasure MeasureTravelStateWindowTweaks][!UpdateMeasure MeasureWindowTooltipTweaks][!UpdateMeasure MeasureFinalCardPolish][!UpdateMeter *][!Redraw]

[MeasurePreferenceAction]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\FilterPreferences.ps1" -Action "#PreferenceAction#" -Value "#PreferenceValue#"
State=Hide
Timeout=5000
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeasure MeasureHeaderLayout][!UpdateMeasure MeasureCardPresenter][!UpdateMeasure MeasureCardTweaks][!UpdateMeasure MeasureFreshnessGuard][!UpdateMeasure MeasureTravelStateWindowTweaks][!UpdateMeasure MeasureWindowTooltipTweaks][!UpdateMeasure MeasureFinalCardPolish][!UpdateMeter *][!Redraw]

[MeasureState]
Measure=Script
ScriptFile=#@#Scripts\StateReader.lua
StateFile=#@#Generated\ui-state.kv
HeartbeatFile=#@#Generated\last-update.txt
PollInterval=60
FailureRetryInterval=60
UpdateDivider=1

; Presentation-only chrome compaction. It shifts a freshly laid-out opportunity
; stack upward by exactly the retired filter-band height and touches no card X/W/H/text.
[MeasureHeaderLayout]
Measure=Script
ScriptFile=#@#Scripts\HeaderLayout.lua
UpdateDivider=1

; Presentation-only formatter. StateReader remains authoritative for local sorting,
; trip filtering, flag identity, graph expansion, and row visibility.
[MeasureCardPresenter]
Measure=Script
ScriptFile=#@#Scripts\CardPresenter.lua
StateFile=#@#Generated\ui-state.kv
UpdateDivider=1

; Final presentation pass: compact cost/MV/profit header, dedicated calculation
; info glyph, and the wider/taller inline graph geometry.
[MeasureCardTweaks]
Measure=Script
ScriptFile=#@#Scripts\CardTweaks.lua
StateFile=#@#Generated\ui-state.kv
UpdateDivider=1

[MeterBackground]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,#PanelWidth#,#PanelHeight#,8 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #Border#

[MeterTitle]
Meter=String
X=8
Y=25
StringAlign=LeftCenter
FontFace=Nirmala UI Semilight
FontSize=16
FontColor=#Text#
AntiAlias=1
W=474
ClipString=1
Text=Travel
ToolTipText=Open Torn travel
LeftMouseUpAction=["https://www.torn.com/page.php?sid=travel"]

; Compact bundled filter icon. It replaces the retired ITEM/TRIP/CAT/RESET band.
[MeterFilterIcon]
Meter=Image
X=492
Y=13
W=24
H=24
PreserveAspectRatio=1
ImageName=#@#Images\UI\filter.png
SolidColor=0,0,0,1
ToolTipText=Open trip, country, category, and item filters
LeftMouseUpAction=[!CommandMeasure MeasureState "OpenFilter('Filters')"]

; Bundled gear icon; same compact title-row footprint as the filter control.
[MeterSettingsIcon]
Meter=Image
X=522
Y=13
W=24
H=24
PreserveAspectRatio=1
ImageName=#@#Images\UI\settings.png
SolidColor=0,0,0,1
ToolTipText=Open opportunity, waste, value-basis, Ignore List, and profile settings
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Run"]

[MeterUpdated]
Meter=String
X=12
Y=(#PanelHeight#-20)
W=528
FontFace=Nirmala UI Semilight
FontSize=8
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
ClipString=1
Text=#UpdatedText#

[MeterHeaderBottomLine]
Meter=Shape
