[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureUpdate "Run"]

[Metadata]
Name=Travel Assistant
Author=vagabond1215
Information=Lightweight Torn travel stock and departure assistant. Version 1 tracks Xanax in the United Kingdom and Japan.
Version=0.2.1

[Variables]
PanelWidth=552
Text=222,226,232,255
Muted=145,152,164,255
Panel=24,27,31,248
Card=31,35,40,248
Border=58,64,73,255
Accent=82,174,255,255
Good=86,190,116,255
Warn=232,178,72,255
Bad=224,90,90,255
TravelModeText=Airstrip
UpdatedText=Waiting for first update...
UKTravelText=-
UKDecisionText=Learning - no departure recommendation
UKRestockText=learning
UKLastSoldOutText=-
UKStockText=0
UKPriceText=-
UKStatusText=INSUFFICIENT HISTORY
UKStatusColor=145,152,164,255
UKOverlayText=LEARNING - CHECK WEAV3R
JPTravelText=-
JPDecisionText=Learning - no departure recommendation
JPRestockText=learning
JPLastSoldOutText=-
JPStockText=0
JPPriceText=-
JPStatusText=INSUFFICIENT HISTORY
JPStatusColor=145,152,164,255
JPOverlayText=LEARNING - CHECK WEAV3R

[MeasureUpdate]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\RunUpdate.ps1" -Action Update
State=Hide
Timeout=30000
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeter *][!Redraw]

[MeasureSettings]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -STA -File "#@#Scripts\OpenSettings.ps1"
State=Hide
Timeout=-1

[MeasureState]
Measure=Script
ScriptFile=#@#Scripts\StateReader.lua
StateFile=#@#Generated\state.kv
HeartbeatFile=#@#Generated\last-update.txt
PollInterval=60
FailureRetryInterval=15
UpdateDivider=1

[StyleLabel]
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[StyleValue]
FontFace=Segoe UI
FontSize=10
FontColor=#Text#
AntiAlias=1
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelWidth#,542,8 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #Border#

[MeterTitle]
Meter=String
X=16
Y=12
FontFace=Segoe UI Semibold
FontSize=14
FontColor=#Text#
AntiAlias=1
Text=TRAVEL ASSISTANT

[MeterSettings]
Meter=String
X=536
Y=14
W=150
StringAlign=Right
FontFace=Segoe UI Semibold
FontSize=10
FontColor=#Accent#
AntiAlias=1
Text=SETTINGS  >
ToolTipText=API key, travel mode, company stars, and faction travel perks
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Run"]

[MeterUpdated]
Meter=String
X=16
Y=34
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
Text=#UpdatedText#

