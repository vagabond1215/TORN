[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureUpdate "Run"]

[Metadata]
Name=Travel Assistant
Author=vagabond1215
Information=Lightweight Torn travel stock and departure assistant. Version 1 tracks Xanax in the United Kingdom and Japan.
Version=0.1.0

[Variables]
PanelWidth=552
Text=222,226,232,255
Muted=145,152,164,255
Panel=24,27,31,248
Card=31,35,40,248
Border=58,64,73,255
Accent=82,174,255,255
Good=86,190,116,255
Warn=232,178,72,255
Bad=224,90,90,255
TravelModeText=Airstrip
UpdatedText=Waiting for first update…
UKTravelText=—
UKDecisionText=Learning — no departure recommendation
UKRestockText=learning
UKLastSoldOutText=—
UKStockText=0
UKPriceText=—
UKStatusText=INSUFFICIENT HISTORY
JPTravelText=—
JPDecisionText=Learning — no departure recommendation
JPRestockText=learning
JPLastSoldOutText=—
JPStockText=0
JPPriceText=—
JPStatusText=INSUFFICIENT HISTORY

[MeasureUpdate]
Measure=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\UpdateTracker.ps1" -Action Update
State=Hide
Timeout=30000
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeter *][!Redraw]

[MeasureCycleMode]
Measure=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\UpdateTracker.ps1" -Action CycleTravelMode
State=Hide
Timeout=30000
FinishAction=[!UpdateMeasure MeasureState][!UpdateMeter *][!Redraw]

[MeasurePoll]
Measure=Calc
Formula=1
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureUpdate "Run"]

[MeasureState]
Measure=Script
ScriptFile=#@#Scripts\StateReader.lua
StateFile=#@#Generated\state.kv
UpdateDivider=1

[StyleLabel]
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1

[StyleValue]
FontFace=Segoe UI
FontSize=10
FontColor=#Text#
AntiAlias=1
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelWidth#,542,8 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #Border#

[MeterTitle]
Meter=String
X=16
Y=12
FontFace=Segoe UI Semibold
FontSize=14
FontColor=#Text#
AntiAlias=1
Text=TRAVEL ASSISTANT

[MeterMode]
Meter=String
X=536
Y=14
W=150
StringAlign=Right
FontFace=Segoe UI Semibold
FontSize=10
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1
Text=#TravelModeText#  ›
ToolTipText=Click to cycle Standard / Airstrip / WLT / Business
LeftMouseUpAction=[!CommandMeasure MeasureCycleMode "Run"]

[MeterUpdated]
Meter=String
X=16
Y=34
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
Text=#UpdatedText#

