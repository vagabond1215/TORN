Text=#OptimalItem8PriceText# (#OptimalItem8MarketValueText#)
ToolTipText=#OptimalItem8Tooltip#
[MeterOptimalItem8Chance]
Meter=String
Group=OptimalItemRow8
X=500
Y=(#RouteY#+263)
W=44
StringAlign=Right
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
DynamicVariables=1
Hidden=1
Text=#OptimalItem8ChanceText#
[MeterOptimalItem8Chart]
Meter=String
Group=OptimalItemRow8
X=538
Y=(#RouteY#+263)
W=34
StringAlign=Right
FontFace=Segoe UI Semibold
FontSize=7
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1
Hidden=1
Text=GRAPH
ToolTipText=Open 8-hour stock history for this route item
LeftMouseUpAction=[!SetVariable ViewerRow "8"][!CommandMeasure MeasureItemViewer "Run"]
