name: Import growth submission images

on:
  push:
    branches:
      - update/growth-endings-cole-gambiit-coolblu3-lythen
    paths:
      - '.upload_chunks/READY'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild submission archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_chunks/images.b64.* | tr -d '\n\r' | base64 -d > /tmp/growth-submissions.zip
          echo "333bbcf8dd46b6455b1bde6fe44173d6d9e8845ae3bf3e33cec14cb3f19ab88b  /tmp/growth-submissions.zip" | sha256sum -c -
          unzip -o /tmp/growth-submissions.zip -d "Growth comp"
          echo "4f9d7c672a17cc6bb18600c9d2ade3bfbe203aa8c9dda5d7f4e256f580cd3ae3  Growth comp/cole3665_Ending_NameStats.jpg" | sha256sum -c -
          echo "1a1a2ec6a92d0efd1acdfd05f002f40b6bb4f1ec7f20b455b5a203b709b63277  Growth comp/cole3665_Ending_TimeStats.jpg" | sha256sum -c -
          echo "88811f5a27b51689303bb212c89ac6c2ca14fdf4e64a78513d11ec58043d176a  Growth comp/Gambiit_Ending.jpg" | sha256sum -c -
          echo "414dc0e4685463c00d997c7014d53bd0d70695b0e8ccee8ec8272f742da08d29  Growth comp/CoolBlu3_Ending.jpg" | sha256sum -c -
          echo "f149a2f2ffbed7088a09f0d14854830fe8a5b34b42ccefa8d4e269e0faf09999  Growth comp/Lythen_Ending_Gym.webp" | sha256sum -c -
          echo "5b15f4d8e0ec737fe5e60127e060b44315d4ab8a6c9993bcadd49fc5409e0be5  Growth comp/Lythen_Ending_TornStats.webp" | sha256sum -c -
      - name: Commit exact submission images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Growth comp/cole3665_Ending_NameStats.jpg" \
                  "Growth comp/cole3665_Ending_TimeStats.jpg" \
                  "Growth comp/Gambiit_Ending.jpg" \
                  "Growth comp/CoolBlu3_Ending.jpg" \
                  "Growth comp/Lythen_Ending_Gym.webp" \
                  "Growth comp/Lythen_Ending_TornStats.webp"
          git rm -r .upload_chunks
          git rm .github/workflows/import-growth-submission-images.yml
          git commit -m "Add new growth contest submission images"
          git push
