name: Import growth submission images

on:
  push:
    branches:
      - update/growth-endings-cole-gambiit-coolblu3-lythen
    paths:
      - '.upload_imgs/READY'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode submission evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Growth comp"
          for src in .upload_imgs/*.webp.b64; do
            name="$(basename "$src" .b64)"
            tr -d '\n\r' < "$src" | base64 -d > "Growth comp/$name"
          done
          echo "1ce8a49b502faadd1ac8ec061a34d9d826438ce35d9cfefbf486317aeebc539c  Growth comp/cole3665_Ending_NameStats.webp" | sha256sum -c -
          echo "9825144541ceebcaeca9b1441fbf13a6b438ecf04a4f24903eb26e3f473b2a87  Growth comp/cole3665_Ending_TimeStats.webp" | sha256sum -c -
          echo "a80898e68f251962d98826f12e707a0f6ff7497336ac982bcf89ce9036e0bb5a  Growth comp/Gambiit_Ending.webp" | sha256sum -c -
          echo "ad0f0362510fbf7ea2de40f1d2a912c3c6d3967277d87431ec800f5fe5e750f0  Growth comp/CoolBlu3_Ending.webp" | sha256sum -c -
          echo "bed8d7407bef66813facc77308c80a105f5831d1d62dc7722e0d0f954bb7b88d  Growth comp/Lythen_Ending_Gym.webp" | sha256sum -c -
          echo "d6e50cbd0207571fbed629a2ec36fda1ba8a287183fbf3dbaab4e2c704305b97  Growth comp/Lythen_Ending_TornStats.webp" | sha256sum -c -
      - name: Commit submission evidence images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Growth comp/cole3665_Ending_NameStats.webp" \
                  "Growth comp/cole3665_Ending_TimeStats.webp" \
                  "Growth comp/Gambiit_Ending.webp" \
                  "Growth comp/CoolBlu3_Ending.webp" \
                  "Growth comp/Lythen_Ending_Gym.webp" \
                  "Growth comp/Lythen_Ending_TornStats.webp"
          git rm -r .upload_imgs
          git rm .github/workflows/import-growth-submission-images.yml
          git commit -m "Add new growth contest submission images"
          git push
