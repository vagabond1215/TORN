name: Inspect growth workbook

on:
  push:
    branches:
      - fix/growth-contest-recovery
    paths:
      - 'AUG2026 Growth Contest.xlsx'
      - 'Growth comp/AUG2026 Growth Contest.xlsx'
      - 'Growth comp/*.png'
      - 'Growth comp/*.jpg'
      - 'Growth comp/*.jpeg'
      - 'Growth comp/*.webp'
      - 'tools/inspect_growth_workbook.py'
      - '.github/workflows/inspect-growth-workbook.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip openpyxl
      - run: python tools/inspect_growth_workbook.py
      - uses: actions/upload-artifact@v4
        with:
          name: growth-workbook-source
          path: 'AUG2026 Growth Contest.xlsx'
      - uses: actions/upload-artifact@v4
        with:
          name: growth-workbook-snapshot
          path: growth_workbook_snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: growth-comp-submissions
          path: |
            Growth comp/*.png
            Growth comp/*.jpg
            Growth comp/*.jpeg
            Growth comp/*.webp
