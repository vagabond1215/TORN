name: Export MisterX73 contest files

on:
  push:
    branches:
      - update/misterx73-result
    paths:
      - '.github/workflows/export-misterx73.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: misterx73-contest-update
          path: |
            Growth comp/AUG2026 Growth Contest.xlsx
            Growth comp/Misterx73_ending.webp
